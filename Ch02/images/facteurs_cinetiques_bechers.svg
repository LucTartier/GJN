<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .beaker { fill: #ffffff; stroke: #475569; stroke-width: 3px; }
      .liquid-1 { fill: #fef08a; opacity: 0.7; }
      .liquid-2 { fill: #fde047; opacity: 0.85; }
      .liquid-3 { fill: #eab308; opacity: 0.95; }
      .label { font-family: system-ui, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
      .detail { font-family: system-ui, sans-serif; font-size: 12px; fill: #334155; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="35" text-anchor="middle" class="title">Facteurs Cinétiques : Influence de [I⁻]₀ (t = 1 à 2 min)</text>

  <!-- Beaker 1 -->
  <g transform="translate(80, 80)">
    <rect x="20" y="60" width="140" height="180" class="beaker" rx="4"/>
    <rect x="23" y="100" width="134" height="137" class="liquid-1" rx="2"/>
    <text x="90" y="270" text-anchor="middle" class="label">Bécher 1</text>
    <text x="90" y="290" text-anchor="middle" class="detail">V(KI) = 10 mL</text>
    <text x="90" y="305" text-anchor="middle" class="detail">[I⁻]₀ = 0,020 mol/L</text>
    <text x="90" y="325" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#854d0e">Jaune Pâle (Lent)</text>
  </g>

  <!-- Beaker 2 -->
  <g transform="translate(310, 80)">
    <rect x="20" y="60" width="140" height="180" class="beaker" rx="4"/>
    <rect x="23" y="100" width="134" height="137" class="liquid-2" rx="2"/>
    <text x="90" y="270" text-anchor="middle" class="label">Bécher 2</text>
    <text x="90" y="290" text-anchor="middle" class="detail">V(KI) = 20 mL</text>
    <text x="90" y="305" text-anchor="middle" class="detail">[I⁻]₀ = 0,040 mol/L</text>
    <text x="90" y="325" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#854d0e">Jaune Moyen</text>
  </g>

  <!-- Beaker 3 -->
  <g transform="translate(540, 80)">
    <rect x="20" y="60" width="140" height="180" class="beaker" rx="4"/>
    <rect x="23" y="100" width="134" height="137" class="liquid-3" rx="2"/>
    <text x="90" y="270" text-anchor="middle" class="label">Bécher 3</text>
    <text x="90" y="290" text-anchor="middle" class="detail">V(KI) = 30 mL</text>
    <text x="90" y="305" text-anchor="middle" class="detail">[I⁻]₀ = 0,060 mol/L</text>
    <text x="90" y="325" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#854d0e">Jaune Intense (Rapide)</text>
  </g>
</svg>
