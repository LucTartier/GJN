<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <rect width="900" height="480" fill="#f8fafc" rx="12"/>
  <title>Protection du fer contre la corrosion : Anode sacrificielle (Zn) vs Nickelage (Ni)</title>
  
  <text x="450" y="32" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Protection Cathodique (Galvanisation / Zinc) vs Nickelage</text>

  <!-- Cas 1 : Protection par Zinc (Anode sacrificielle / Galvanisation) -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="370" height="380" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="185" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">1. Galvanisation / Anode sacrificielle (Zinc)</text>
    
    <rect x="40" y="240" width="290" height="90" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <text x="185" y="290" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Acier / Fer (Fe)</text>
    
    <rect x="40" y="160" width="290" height="80" fill="#e2e8f0" stroke="#0284c7" stroke-width="3" stroke-dasharray="8,4"/>
    <path d="M 160 160 L 175 240 L 190 160 Z" fill="#ffffff"/>
    <text x="185" y="205" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0284c7" text-anchor="middle">Zinc (Zn) - Anode Sacrificielle</text>
    
    <rect x="20" y="340" width="330" height="30" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="185" y="360" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">✓ E°(Zn²⁺/Zn) &lt; E°(Fe²⁺/Fe) : Le Zinc s'oxyde à la place du Fer</text>
  </g>

  <!-- Cas 2 : Protection par Nickel (Nickelage abîmé) -->
  <g transform="translate(480, 60)">
    <rect x="0" y="0" width="370" height="380" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="185" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">2. Nickelage rayé (Protection inefficace)</text>
    
    <rect x="40" y="240" width="290" height="90" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <text x="185" y="290" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Acier / Fer (Fe) - S'OXYDE !</text>
    
    <rect x="40" y="160" width="120" height="80" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <rect x="210" y="160" width="120" height="80" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <rect x="160" y="160" width="50" height="80" fill="#38bdf8" opacity="0.6"/>
    <text x="100" y="205" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Nickel (Ni)</text>
    <text x="270" y="205" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Nickel (Ni)</text>
    <text x="185" y="200" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">Eau</text>
    
    <circle cx="185" cy="240" r="12" fill="#dc2626" opacity="0.7"/>
    <text x="185" y="244" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Rouille</text>

    <rect x="20" y="340" width="330" height="30" rx="4" fill="#fef2f2" stroke="#fecaca"/>
    <text x="185" y="360" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">✗ E°(Fe²⁺/Fe) &lt; E°(Ni²⁺/Ni) : Le Fer s'oxyde (Anode)</text>
  </g>
</svg>