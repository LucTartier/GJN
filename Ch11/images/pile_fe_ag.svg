<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" fill="#f8fafc" rx="12"/>
  <title>Schéma de la pile Fe / Fe²⁺ // AgCl / Ag</title>
  
  <!-- Titre -->
  <text x="450" y="35" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Schéma expérimental de la pile Fe / Fe²⁺ // AgCl / Ag</text>
  
  <!-- Bécher 1 (Fe) -->
  <rect x="150" y="160" width="220" height="240" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <rect x="155" y="210" width="210" height="185" fill="#bae6fd" opacity="0.6"/>
  <text x="260" y="390" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0369a1" text-anchor="middle">Bécher ① : Fe²⁺ (1,0×10⁻⁵ M)</text>

  <!-- Électrode Fe -->
  <rect x="200" y="100" width="30" height="180" fill="#64748b" stroke="#334155" stroke-width="2"/>
  <text x="215" y="90" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">Fe (Anode, -)</text>

  <!-- Bécher 2 (Ag/AgCl) -->
  <rect x="530" y="160" width="220" height="240" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="3"/>
  <rect x="535" y="210" width="210" height="185" fill="#e2e8f0" opacity="0.6"/>
  <text x="640" y="380" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">Bécher ② : AgCl(s) + Cl⁻</text>
  <text x="640" y="400" font-family="sans-serif" font-size="14" fill="#475569" text-anchor="middle">[Cl⁻] = 1,0×10⁻⁵ M</text>

  <!-- Électrode Ag + AgCl -->
  <rect x="670" y="100" width="30" height="180" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <rect x="666" y="190" width="38" height="80" fill="#94a3b8" opacity="0.8" rx="3" stroke="#475569" stroke-dasharray="2,2"/>
  <text x="685" y="90" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Ag (Cathode, +)</text>

  <!-- Pont salin -->
  <path d="M 310 240 L 310 140 L 590 140 L 590 240" fill="none" stroke="#f59e0b" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
  <path d="M 310 240 L 310 140 L 590 140 L 590 240" fill="none" stroke="#fef3c7" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="450" y="132" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">Pont salin (K⁺ + Cl⁻)</text>
  
  <!-- Circuit extérieur & Ampèremètre -->
  <path d="M 215 100 L 215 60 L 410 60" fill="none" stroke="#1e293b" stroke-width="3"/>
  <circle cx="450" cy="60" r="22" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <text x="450" y="66" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">A</text>
  <path d="M 490 60 L 685 60 L 685 100" fill="none" stroke="#1e293b" stroke-width="3"/>

  <!-- Flèches de courant et électrons -->
  <path d="M 260 50 L 370 50" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="315" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">e⁻ (du - vers le +)</text>
  
  <path d="M 640 50 L 530 50" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="585" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">I (du + vers le -)</text>

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-ion" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Migration des ions dans le pont salin -->
  <path d="M 420 140 L 330 140" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-ion)"/>
  <text x="365" y="160" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">Anions Cl⁻ → ①</text>
  
  <path d="M 480 140 L 570 140" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-ion)"/>
  <text x="535" y="160" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">Cations K⁺ → ②</text>

  <!-- Légende réactions aux électrodes -->
  <rect x="120" y="430" width="280" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="260" y="450" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">Oxydation (Anode -) :</text>
  <text x="260" y="468" font-family="sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Fe (s) = Fe²⁺ (aq) + 2 e⁻</text>

  <rect x="500" y="430" width="280" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="640" y="450" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">Réduction (Cathode +) :</text>
  <text x="640" y="468" font-family="sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">AgCl (s) + e⁻ = Ag (s) + Cl⁻ (aq)</text>
</svg>